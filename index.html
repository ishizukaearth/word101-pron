<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English Pronunciation Trainer</title>
    <style>
:root {
  color-scheme: light;
  --ink: #172026;
  --muted: #66727c;
  --line: #d7dde2;
  --panel: #ffffff;
  --page: #f4f7f8;
  --accent: #157f7f;
  --accent-strong: #0d5f64;
  --warn: #bd5a2a;
  --good: #23845f;
  --shadow: 0 18px 45px rgba(23, 32, 38, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
textarea,
input {
  font: inherit;
}

.app-shell {
  width: min(100%, 980px);
  margin: 0 auto;
  padding: 18px;
}

.top-bar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0 18px;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--accent-strong);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2 {
  margin: 0;
}

h1 {
  font-size: 2rem;
}

h2 {
  font-size: 1rem;
}

.progress-card {
  min-width: 145px;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.progress-card span {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.88rem;
}

progress {
  width: 100%;
  height: 8px;
  accent-color: var(--accent);
}

.practice-panel,
.wave-panel,
.spectrum-panel,
.tools-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.practice-panel {
  padding: 22px;
}

.word-area {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 14px;
}

.word-number {
  min-width: 58px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted);
  text-align: center;
  font-weight: 700;
}

.word {
  overflow-wrap: anywhere;
  font-size: clamp(2.5rem, 14vw, 5.4rem);
  line-height: 0.95;
  font-weight: 800;
}

.focus-letter {
  color: #c5362f;
}

.meaning {
  margin-top: 8px;
  color: var(--muted);
  font-size: 1.1rem;
}

.focus-row {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.focus-chip {
  display: inline-flex;
  min-width: 56px;
  height: 34px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-weight: 700;
}

.focus-chip.active {
  border-color: var(--accent);
  background: #e4f5f3;
  color: var(--accent-strong);
}

.controls {
  display: grid;
  grid-template-columns: 44px 1fr 1.1fr 1fr 44px;
  gap: 10px;
}

button {
  min-height: 46px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 750;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.icon-button {
  background: #e7ecef;
  color: var(--ink);
  font-size: 1.25rem;
}

.main-button {
  background: var(--accent);
  color: #fff;
}

.main-button.recording {
  animation: recordingPulse 0.8s ease-in-out infinite alternate;
  background: #8ca4a6;
}

.record-button {
  background: var(--warn);
  color: #fff;
}

.record-button.recording {
  background: #9f2f2f;
}

@keyframes recordingPulse {
  from {
    opacity: 0.42;
  }

  to {
    opacity: 1;
  }
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.score-tile {
  min-height: 76px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.label,
.wave-label {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 700;
}

.score-tile strong {
  display: block;
  margin-top: 4px;
  font-size: 1.7rem;
}

.wave-panel,
.spectrum-panel,
.tools-panel {
  margin-top: 14px;
  padding: 18px;
}

.wave-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

#recordingStatus {
  color: var(--muted);
  font-size: 0.9rem;
}

.wave-stack {
  display: grid;
  gap: 12px;
}

canvas {
  display: block;
  width: 100%;
  height: 128px;
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfd;
}

#spectrumCanvas {
  height: 190px;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}

details + details {
  margin-top: 10px;
}

summary {
  cursor: pointer;
  font-weight: 750;
}

.import-grid,
.recognition-box {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}

.file-box {
  display: grid;
  gap: 8px;
  padding: 12px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  color: var(--muted);
}

textarea {
  min-height: 130px;
  width: 100%;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

select {
  min-height: 46px;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 10px;
  background: #fff;
}

#loadPasteButton,
#loadHostedButton,
#recognitionButton {
  background: #26343d;
  color: #fff;
}

#recognitionResult {
  margin: 0;
  color: var(--muted);
}

@media (max-width: 680px) {
  .app-shell {
    padding: 12px;
  }

  .top-bar {
    align-items: stretch;
    flex-direction: column;
  }

  .controls {
    grid-template-columns: 44px 1fr 1fr 44px;
  }

  #playMineButton {
    grid-column: 2 / 4;
  }

  .score-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .feature-grid {
    grid-template-columns: 1fr;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="top-bar" aria-label="学習状況">
        <div>
          <p class="eyebrow">100-word pronunciation practice</p>
          <h1>発音練習</h1>
        </div>
        <div class="progress-card">
          <span id="progressText">1 / 12</span>
          <progress id="progressBar" value="1" max="12"></progress>
        </div>
      </section>

      <section class="practice-panel">
        <div class="word-area">
          <div class="word-number" id="wordNumber">001</div>
          <div>
            <div class="word" id="wordText">apple</div>
            <div class="meaning" id="meaningText">りんご</div>
          </div>
        </div>

        <div class="focus-row" aria-label="重点音">
          <span class="focus-chip" id="aeChip">/ae/</span>
          <span class="focus-chip" id="thChip">/th/</span>
          <span class="focus-chip" id="rChip">/r/</span>
        </div>

        <div class="controls" aria-label="練習操作">
          <button class="icon-button" id="prevButton" type="button" title="前の単語">←</button>
          <button class="main-button" id="speakButton" type="button">モデル音声</button>
          <button class="record-button" id="recordButton" type="button">もう一度録音</button>
          <button class="main-button" id="playMineButton" type="button" disabled>自分を再生</button>
          <button class="icon-button" id="nextButton" type="button" title="次の単語">→</button>
        </div>

        <div class="score-grid">
          <div class="score-tile">
            <span class="label">総合</span>
            <strong id="overallScore">--</strong>
          </div>
          <div class="score-tile">
            <span class="label">長さ</span>
            <strong id="durationScore">--</strong>
          </div>
          <div class="score-tile">
            <span class="label">音量</span>
            <strong id="volumeScore">--</strong>
          </div>
          <div class="score-tile">
            <span class="label">重点音</span>
            <strong id="focusScore">--</strong>
          </div>
        </div>
      </section>

      <section class="wave-panel" aria-label="波形比較">
        <div class="wave-header">
          <h2>波形比較</h2>
          <span id="recordingStatus">録音待機中</span>
        </div>
        <div class="wave-stack">
          <div>
            <div class="wave-label">モデル目安</div>
            <canvas id="modelCanvas" width="900" height="180"></canvas>
          </div>
          <div>
            <div class="wave-label">あなたの録音</div>
            <canvas id="userCanvas" width="900" height="180"></canvas>
          </div>
        </div>
      </section>

      <section class="spectrum-panel" aria-label="スペクトラム分析">
        <div class="wave-header">
          <h2>スペクトラム分析</h2>
          <span id="analysisLatency">未解析</span>
        </div>
        <canvas id="spectrumCanvas" width="900" height="260"></canvas>
        <div class="feature-grid">
          <div class="score-tile">
            <span class="label">母音帯域</span>
            <strong id="vowelFeature">--</strong>
          </div>
          <div class="score-tile">
            <span class="label">/r/候補</span>
            <strong id="rFeature">--</strong>
          </div>
          <div class="score-tile">
            <span class="label">/th/高域</span>
            <strong id="thFeature">--</strong>
          </div>
        </div>
      </section>

      <section class="tools-panel">
        <details>
          <summary>単語リストを読み込む</summary>
          <div class="import-grid">
            <select id="hostedWordSelect" aria-label="公開済み単語ファイル">
              <option value="JH001.txt">JH001.txt</option>
              <option value="JH101.txt">JH101.txt</option>
              <option value="JH201.txt">JH201.txt</option>
              <option value="JH301.txt">JH301.txt</option>
              <option value="JH401.txt">JH401.txt</option>
              <option value="JH501.txt">JH501.txt</option>
              <option value="JH601.txt">JH601.txt</option>
              <option value="JH701.txt">JH701.txt</option>
              <option value="JH801.txt">JH801.txt</option>
              <option value="JH901.txt">JH901.txt</option>
              <option value="JH1001.txt">JH1001.txt</option>
              <option value="JH1101.txt">JH1101.txt</option>
              <option value="JH1201.txt">JH1201.txt</option>
              <option value="JH1301.txt">JH1301.txt</option>
            </select>
            <button id="loadHostedButton" type="button">公開済みリストを読み込む</button>
            <label class="file-box">
              <span>端末内の単語ファイルを選択</span>
              <input id="fileInput" type="file" accept=".txt,text/plain">
            </label>
            <textarea id="wordPaste" placeholder="001#apple#りんご&#10;002#book#本"></textarea>
            <button id="loadPasteButton" type="button">貼り付け内容を読み込む</button>
          </div>
        </details>

        <details>
          <summary>音声認識レスポンス確認</summary>
          <div class="recognition-box">
            <button id="recognitionButton" type="button">ブラウザ音声認識を試す</button>
            <p id="recognitionResult">未実行</p>
          </div>
        </details>
      </section>
    </main>

    <script>
const fallbackWordsText = `001#apple#りんご
002#bag#かばん
003#thank#感謝する
004#three#3
005#think#考える
006#red#赤い
007#right#右、正しい
008#read#読む
009#cat#猫
010#that#あれ、それ
011#river#川
012#around#周囲に`;

const state = {
  words: parseWordText(fallbackWordsText),
  index: -1,
  micStream: null,
  mediaRecorder: null,
  recordingChunks: [],
  recordedBlob: null,
  recordedUrl: null,
  audioContext: null,
  vad: null,
  recordingStartedAt: 0,
  lastMetrics: null,
};

const els = {
  progressText: document.querySelector("#progressText"),
  progressBar: document.querySelector("#progressBar"),
  wordNumber: document.querySelector("#wordNumber"),
  wordText: document.querySelector("#wordText"),
  meaningText: document.querySelector("#meaningText"),
  aeChip: document.querySelector("#aeChip"),
  thChip: document.querySelector("#thChip"),
  rChip: document.querySelector("#rChip"),
  prevButton: document.querySelector("#prevButton"),
  nextButton: document.querySelector("#nextButton"),
  speakButton: document.querySelector("#speakButton"),
  recordButton: document.querySelector("#recordButton"),
  playMineButton: document.querySelector("#playMineButton"),
  modelCanvas: document.querySelector("#modelCanvas"),
  userCanvas: document.querySelector("#userCanvas"),
  spectrumCanvas: document.querySelector("#spectrumCanvas"),
  recordingStatus: document.querySelector("#recordingStatus"),
  analysisLatency: document.querySelector("#analysisLatency"),
  overallScore: document.querySelector("#overallScore"),
  durationScore: document.querySelector("#durationScore"),
  volumeScore: document.querySelector("#volumeScore"),
  focusScore: document.querySelector("#focusScore"),
  vowelFeature: document.querySelector("#vowelFeature"),
  rFeature: document.querySelector("#rFeature"),
  thFeature: document.querySelector("#thFeature"),
  fileInput: document.querySelector("#fileInput"),
  hostedWordSelect: document.querySelector("#hostedWordSelect"),
  loadHostedButton: document.querySelector("#loadHostedButton"),
  wordPaste: document.querySelector("#wordPaste"),
  loadPasteButton: document.querySelector("#loadPasteButton"),
  recognitionButton: document.querySelector("#recognitionButton"),
  recognitionResult: document.querySelector("#recognitionResult"),
};

render();
autoLoadDefaultWords();
requestMicrophoneAccess();

els.prevButton.addEventListener("click", () => moveWord(-1));
els.nextButton.addEventListener("click", nextPractice);
els.speakButton.addEventListener("click", () => speakCurrentWord({ recordAfter: false }));
els.recordButton.addEventListener("click", retryRecording);
els.playMineButton.addEventListener("click", playRecording);
els.fileInput.addEventListener("change", loadSelectedFile);
els.loadHostedButton.addEventListener("click", loadHostedWords);
els.loadPasteButton.addEventListener("click", loadPastedWords);
els.recognitionButton.addEventListener("click", runRecognitionCheck);

function parseWordText(text) {
  return text
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line, lineIndex) => {
      const parts = line.split("#");
      return {
        id: (parts[0] || String(lineIndex + 1)).trim(),
        spelling: (parts[1] || "").trim(),
        meaning: parts.slice(2).join("#").trim(),
      };
    })
    .filter((item) => item.spelling);
}

function render() {
  const word = currentWord();
  const currentNumber = state.index < 0 ? 0 : state.index + 1;
  els.progressText.textContent = `${currentNumber} / ${state.words.length}`;
  els.progressBar.max = state.words.length;
  els.progressBar.value = currentNumber;
  els.wordNumber.textContent = word?.id || "---";
  els.wordText.innerHTML = word ? renderFocusedSpelling(word.spelling) : "▶";
  els.meaningText.textContent = word ? (word.meaning || "意味なし") : "右矢印で最初の単語を開始";
  els.prevButton.disabled = state.index <= 0;
  els.nextButton.disabled = state.index === state.words.length - 1;
  els.playMineButton.disabled = !state.recordedBlob;
  els.recordButton.disabled = state.index < 0;

  const focus = word ? getFocusSounds(word.spelling) : { ae: false, th: false, r: false };
  setChip(els.aeChip, focus.ae);
  setChip(els.thChip, focus.th);
  setChip(els.rChip, focus.r);

  if (word) drawModelWave(word.spelling);
  else clearCanvas(els.modelCanvas, "右矢印で開始します");
  if (!state.recordedBlob) {
    clearCanvas(els.userCanvas, "録音するとここに波形が表示されます");
    clearCanvas(els.spectrumCanvas, "録音後にスペクトログラムを表示します");
    resetScores();
  }
}

function currentWord() {
  return state.index >= 0 ? state.words[state.index] : null;
}

function setChip(element, active) {
  element.classList.toggle("active", active);
}

function moveWord(delta) {
  state.index = Math.min(Math.max(state.index + delta, 0), state.words.length - 1);
  clearRecording();
  render();
}

function nextPractice() {
  if (state.index < state.words.length - 1) {
    state.index += 1;
    clearRecording();
    render();
    speakCurrentWord({ recordAfter: true });
  }
}

function retryRecording() {
  if (state.index < 0) return;
  startRecording({ autoStop: true, source: "manual" });
}

function speakCurrentWord({ recordAfter }) {
  const current = currentWord();
  if (!current) return;
  const word = current.spelling;
  if (!("speechSynthesis" in window)) {
    setStatus("このブラウザは読み上げに対応していません");
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = 0.82;
  utterance.pitch = 1;
  utterance.onstart = () => setStatus("モデル音声を再生中");
  utterance.onend = () => {
    if (recordAfter) {
      setStatus("0.1秒後に録音を開始します");
      window.setTimeout(() => startRecording({ autoStop: true, source: "model" }), 100);
    } else {
      setStatus("聞き比べできます");
    }
  };
  window.speechSynthesis.speak(utterance);
}

async function startRecording({ autoStop, source }) {
  if (state.mediaRecorder?.state === "recording") {
    stopRecording();
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("このブラウザは録音に対応していません");
    return;
  }

  try {
    clearRecording();
    const audioContext = getAudioContext();
    if (audioContext.state === "suspended") await audioContext.resume();
    const stream = await ensureMicrophoneStream();
    const mimeType = pickMimeType();
    state.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    state.recordingChunks = [];
    state.recordingStartedAt = performance.now();

    state.mediaRecorder.addEventListener("dataavailable", (event) => {
      if (event.data.size > 0) state.recordingChunks.push(event.data);
    });

    state.mediaRecorder.addEventListener("stop", async () => {
      stopVad();
      const type = state.recordingChunks[0]?.type || "audio/webm";
      const rawBlob = new Blob(state.recordingChunks, { type });
      els.recordButton.textContent = "もう一度録音";
      els.recordButton.classList.remove("recording");
      els.playMineButton.classList.remove("recording");
      setStatus("録音完了");
      await analyzeRecording(rawBlob);
    });

    state.mediaRecorder.start(100);
    els.recordButton.textContent = "録音停止";
    els.recordButton.classList.add("recording");
    els.playMineButton.disabled = true;
    els.playMineButton.classList.add("recording");
    setStatus(source === "model" ? "復唱してください" : "録音中");
    if (autoStop) startVad(stream);
  } catch (error) {
    setStatus("マイクの使用が許可されませんでした");
  }
}

async function requestMicrophoneAccess() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("このブラウザは録音に対応していません");
    return;
  }

  try {
    await ensureMicrophoneStream();
    setStatus("マイク準備完了。右矢印で開始");
  } catch (error) {
    setStatus("マイク許可待ち。右矢印または録音開始で再確認します");
  }
}

async function ensureMicrophoneStream() {
  if (state.micStream?.active) return state.micStream;
  state.micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    },
  });
  return state.micStream;
}

function stopRecording() {
  if (state.mediaRecorder?.state === "recording") {
    state.mediaRecorder.stop();
  }
}

function startVad(stream) {
  stopVad();
  const audioContext = getAudioContext();
  const source = audioContext.createMediaStreamSource(stream);
  const analyser = audioContext.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);

  const data = new Float32Array(analyser.fftSize);
  const threshold = 0.025;
  const silenceAfterSpeechMs = 200;
  const maxRecordingMs = 6000;
  const minSpeechMs = 120;
  let hasSpeech = false;
  let speechStartedAt = 0;
  let silentSince = 0;

  const tick = () => {
    if (state.mediaRecorder?.state !== "recording") return;
    analyser.getFloatTimeDomainData(data);
    const rms = getRms(data);
    const now = performance.now();
    const isSpeech = rms >= threshold;

    if (isSpeech) {
      if (!hasSpeech) {
        hasSpeech = true;
        speechStartedAt = now;
        setStatus("発声を検出しました");
      }
      silentSince = 0;
    } else if (hasSpeech && !silentSince) {
      silentSince = now;
    }

    const speechLongEnough = hasSpeech && now - speechStartedAt >= minSpeechMs;
    const silenceLongEnough = silentSince && now - silentSince >= silenceAfterSpeechMs;
    const timedOut = now - state.recordingStartedAt >= maxRecordingMs;

    if ((speechLongEnough && silenceLongEnough) || timedOut) {
      stopRecording();
      return;
    }

    state.vad.frameId = requestAnimationFrame(tick);
  };

  state.vad = { frameId: requestAnimationFrame(tick), source, analyser };
}

function stopVad() {
  if (!state.vad) return;
  cancelAnimationFrame(state.vad.frameId);
  state.vad.source.disconnect();
  state.vad.analyser.disconnect();
  state.vad = null;
}

function pickMimeType() {
  const candidates = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/mp4",
    "audio/mpeg",
  ];
  return candidates.find((type) => window.MediaRecorder?.isTypeSupported(type));
}

function playRecording() {
  if (!state.recordedUrl) return;
  const audio = new Audio(state.recordedUrl);
  audio.play();
}

async function analyzeRecording(rawBlob) {
  const analysisStartedAt = performance.now();
  const buffer = await rawBlob.arrayBuffer();
  const audioContext = getAudioContext();
  const rawAudioBuffer = await audioContext.decodeAudioData(buffer.slice(0));
  const audioBuffer = trimSpeechBuffer(rawAudioBuffer, {
    leadingThreshold: 0.018,
    trailingSecondsToCut: 0.2,
    leadingPrerollSeconds: 0.03,
  });
  const samples = audioBuffer.getChannelData(0);
  const envelope = createEnvelope(samples, 160);
  const metrics = getRecordingMetrics(samples, audioBuffer.duration, envelope);
  const spectral = analyzeSpectrum(samples, audioBuffer.sampleRate);
  state.lastMetrics = metrics;
  state.recordedBlob = encodeWav(audioBuffer);
  state.recordedUrl = URL.createObjectURL(state.recordedBlob);
  els.playMineButton.disabled = false;
  drawEnvelope(els.userCanvas, envelope, "#bd5a2a");
  drawSpectrogram(els.spectrumCanvas, spectral);
  renderSpectralFeatures(spectral, performance.now() - analysisStartedAt);
  renderScores(metrics);
}

function getAudioContext() {
  if (!state.audioContext) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    state.audioContext = new AudioContextClass();
  }
  return state.audioContext;
}

function createEnvelope(samples, bucketCount) {
  const bucketSize = Math.max(1, Math.floor(samples.length / bucketCount));
  const envelope = [];
  for (let i = 0; i < bucketCount; i += 1) {
    let sum = 0;
    const start = i * bucketSize;
    const end = Math.min(samples.length, start + bucketSize);
    for (let j = start; j < end; j += 1) {
      sum += Math.abs(samples[j]);
    }
    envelope.push(sum / Math.max(1, end - start));
  }
  return normalize(envelope);
}

function trimSpeechBuffer(audioBuffer, options) {
  const sampleRate = audioBuffer.sampleRate;
  const source = audioBuffer.getChannelData(0);
  const windowSize = Math.max(1, Math.round(sampleRate * 0.02));
  let speechStart = 0;

  for (let index = 0; index < source.length; index += windowSize) {
    const end = Math.min(source.length, index + windowSize);
    if (getRms(source.subarray(index, end)) >= options.leadingThreshold) {
      speechStart = Math.max(0, index - Math.round(options.leadingPrerollSeconds * sampleRate));
      break;
    }
  }

  const cutSamples = Math.round(options.trailingSecondsToCut * sampleRate);
  const speechEnd = Math.max(speechStart + 1, source.length - cutSamples);
  const targetLength = Math.max(1, speechEnd - speechStart);
  const trimmed = getAudioContext().createBuffer(1, targetLength, sampleRate);
  trimmed.copyToChannel(source.slice(speechStart, speechEnd), 0);
  return trimmed;
}

function normalize(values) {
  const max = Math.max(...values, 0.001);
  return values.map((value) => value / max);
}

function getRecordingMetrics(samples, duration, envelope) {
  let sumSquares = 0;
  let peak = 0;
  for (const sample of samples) {
    const abs = Math.abs(sample);
    peak = Math.max(peak, abs);
    sumSquares += sample * sample;
  }
  const rms = Math.sqrt(sumSquares / samples.length);
  const expected = expectedDuration(currentWord().spelling);
  const durationScore = clamp(100 - Math.abs(duration - expected) * 35, 20, 100);
  const volumeScore = clamp((rms / 0.09) * 100, 15, 100);
  const focusScore = estimateFocusScore(currentWord().spelling, envelope, peak);
  const overall = Math.round(durationScore * 0.38 + volumeScore * 0.32 + focusScore * 0.3);
  return {
    duration,
    expected,
    rms,
    peak,
    durationScore: Math.round(durationScore),
    volumeScore: Math.round(volumeScore),
    focusScore: Math.round(focusScore),
    overall,
  };
}

function expectedDuration(word) {
  const letters = word.replace(/[^a-z]/gi, "").length;
  return clamp(0.5 + letters * 0.085, 0.75, 1.9);
}

function estimateFocusScore(word, envelope, peak) {
  const matches = getFocusMatches(word);
  if (!matches.length) return 88;
  const averageEnergy = envelope.reduce((sum, value) => sum + value, 0) / envelope.length;
  const scores = matches.map((match) => {
    const center = ((match.start + match.end) / 2) / Math.max(1, word.length);
    const halfWindow = match.kind === "th" ? 0.08 : 0.06;
    const from = Math.max(0, Math.floor((center - halfWindow) * envelope.length));
    const to = Math.min(envelope.length, Math.ceil((center + halfWindow) * envelope.length));
    const local = envelope.slice(from, to);
    const localEnergy = local.reduce((sum, value) => sum + value, 0) / Math.max(1, local.length);
    const relativeEnergy = localEnergy / Math.max(averageEnergy, 0.05);
    const energyScore = clamp(relativeEnergy * 74, 35, 100);
    const peakScore = peak > 0.08 ? 100 : 72;
    return energyScore * 0.7 + peakScore * 0.3;
  });
  return scores.reduce((sum, score) => sum + score, 0) / scores.length;
}

function renderScores(metrics) {
  els.overallScore.textContent = metrics.overall;
  els.durationScore.textContent = metrics.durationScore;
  els.volumeScore.textContent = metrics.volumeScore;
  els.focusScore.textContent = metrics.focusScore;
  setStatus(`録音 ${metrics.duration.toFixed(1)}秒 / 目安 ${metrics.expected.toFixed(1)}秒`);
}

function resetScores() {
  els.overallScore.textContent = "--";
  els.durationScore.textContent = "--";
  els.volumeScore.textContent = "--";
  els.focusScore.textContent = "--";
  els.vowelFeature.textContent = "--";
  els.rFeature.textContent = "--";
  els.thFeature.textContent = "--";
  els.analysisLatency.textContent = "未解析";
}

function getFocusSounds(word) {
  const matches = getFocusMatches(word);
  return {
    ae: matches.some((match) => match.kind === "ae"),
    th: matches.some((match) => match.kind === "th"),
    r: matches.some((match) => match.kind === "r"),
  };
}

function getFocusMatches(word) {
  const normalized = word.toLowerCase();
  const matches = [];
  for (let index = 0; index < normalized.length; index += 1) {
    const pair = normalized.slice(index, index + 2);
    if (pair === "th") {
      matches.push({ start: index, end: index + 2, kind: "th" });
      index += 1;
      continue;
    }

    const char = normalized[index];
    const nextTwo = normalized.slice(index, index + 2);
    const nextThree = normalized.slice(index, index + 3);
    if (char === "a" && !["ar", "ai", "ay", "aw", "au"].includes(nextTwo) && nextThree !== "all") {
      matches.push({ start: index, end: index + 1, kind: "ae" });
    }
    if (char === "r") {
      matches.push({ start: index, end: index + 1, kind: "r" });
    }
  }
  return matches;
}

function renderFocusedSpelling(word) {
  const matches = getFocusMatches(word);
  if (!matches.length) return escapeHtml(word);
  let html = "";
  let cursor = 0;
  for (const match of matches) {
    if (match.start < cursor) continue;
    html += escapeHtml(word.slice(cursor, match.start));
    html += `<span class="focus-letter focus-${match.kind}">${escapeHtml(word.slice(match.start, match.end))}</span>`;
    cursor = match.end;
  }
  html += escapeHtml(word.slice(cursor));
  return html;
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;",
  }[char]));
}

function drawModelWave(word) {
  const duration = expectedDuration(word);
  const points = 160;
  const syllableHint = Math.max(1, Math.min(4, Math.round(word.length / 4)));
  const envelope = Array.from({ length: points }, (_, index) => {
    const t = index / (points - 1);
    const pulse = Math.sin(t * Math.PI * syllableHint) ** 2;
    const taper = Math.sin(t * Math.PI);
    const consonant = getFocusSounds(word).th && t > 0.2 && t < 0.48 ? 0.18 : 0;
    return Math.max(0.04, (pulse * 0.8 + consonant) * taper * duration);
  });
  drawEnvelope(els.modelCanvas, normalize(envelope), "#157f7f");
}

function drawEnvelope(canvas, envelope, color) {
  const context = canvas.getContext("2d");
  const { width, height } = canvas;
  context.clearRect(0, 0, width, height);
  drawGrid(context, width, height);
  const center = height / 2;
  const step = width / Math.max(1, envelope.length - 1);

  context.beginPath();
  envelope.forEach((value, index) => {
    const x = index * step;
    const y = center - value * center * 0.82;
    if (index === 0) context.moveTo(x, y);
    else context.lineTo(x, y);
  });
  for (let index = envelope.length - 1; index >= 0; index -= 1) {
    const x = index * step;
    const y = center + envelope[index] * center * 0.82;
    context.lineTo(x, y);
  }
  context.closePath();
  context.fillStyle = color;
  context.globalAlpha = 0.22;
  context.fill();
  context.globalAlpha = 1;
  context.strokeStyle = color;
  context.lineWidth = 2;
  context.stroke();
}

function drawGrid(context, width, height) {
  context.fillStyle = "#fbfcfd";
  context.fillRect(0, 0, width, height);
  context.strokeStyle = "#e6ebef";
  context.lineWidth = 1;
  for (let i = 1; i < 4; i += 1) {
    const y = (height / 4) * i;
    context.beginPath();
    context.moveTo(0, y);
    context.lineTo(width, y);
    context.stroke();
  }
}

function analyzeSpectrum(samples, sampleRate) {
  const fftSize = 1024;
  const hopSize = 256;
  const maxFrequency = Math.min(8000, sampleRate / 2);
  const maxBin = Math.floor((maxFrequency / sampleRate) * fftSize);
  const window = createHannWindow(fftSize);
  const frames = [];

  for (let start = 0; start + fftSize <= samples.length; start += hopSize) {
    const real = new Float32Array(fftSize);
    const imag = new Float32Array(fftSize);
    for (let i = 0; i < fftSize; i += 1) {
      real[i] = samples[start + i] * window[i];
    }
    fft(real, imag);
    const magnitudes = new Float32Array(maxBin);
    for (let bin = 1; bin < maxBin; bin += 1) {
      magnitudes[bin] = Math.sqrt(real[bin] * real[bin] + imag[bin] * imag[bin]);
    }
    frames.push(magnitudes);
  }

  const safeFrames = frames.length ? frames : [new Float32Array(maxBin)];
  return {
    frames: safeFrames,
    sampleRate,
    fftSize,
    maxFrequency,
    vowel: bandEnergy(safeFrames, sampleRate, fftSize, 500, 2500),
    rBand: bandEnergy(safeFrames, sampleRate, fftSize, 1200, 3000),
    thBand: bandEnergy(safeFrames, sampleRate, fftSize, 4000, 8000),
  };
}

function createHannWindow(size) {
  return Array.from({ length: size }, (_, index) => {
    return 0.5 * (1 - Math.cos((2 * Math.PI * index) / (size - 1)));
  });
}

function fft(real, imag) {
  const n = real.length;
  for (let i = 1, j = 0; i < n; i += 1) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      [real[i], real[j]] = [real[j], real[i]];
      [imag[i], imag[j]] = [imag[j], imag[i]];
    }
  }

  for (let length = 2; length <= n; length <<= 1) {
    const angle = (-2 * Math.PI) / length;
    const wlenReal = Math.cos(angle);
    const wlenImag = Math.sin(angle);
    for (let i = 0; i < n; i += length) {
      let wReal = 1;
      let wImag = 0;
      for (let j = 0; j < length / 2; j += 1) {
        const evenReal = real[i + j];
        const evenImag = imag[i + j];
        const oddReal = real[i + j + length / 2] * wReal - imag[i + j + length / 2] * wImag;
        const oddImag = real[i + j + length / 2] * wImag + imag[i + j + length / 2] * wReal;
        real[i + j] = evenReal + oddReal;
        imag[i + j] = evenImag + oddImag;
        real[i + j + length / 2] = evenReal - oddReal;
        imag[i + j + length / 2] = evenImag - oddImag;
        const nextReal = wReal * wlenReal - wImag * wlenImag;
        wImag = wReal * wlenImag + wImag * wlenReal;
        wReal = nextReal;
      }
    }
  }
}

function bandEnergy(frames, sampleRate, fftSize, lowHz, highHz) {
  const lowBin = Math.max(1, Math.floor((lowHz / sampleRate) * fftSize));
  const highBin = Math.min(frames[0].length - 1, Math.ceil((highHz / sampleRate) * fftSize));
  let band = 0;
  let total = 0;
  for (const frame of frames) {
    for (let bin = 1; bin < frame.length; bin += 1) {
      const value = frame[bin] * frame[bin];
      total += value;
      if (bin >= lowBin && bin <= highBin) band += value;
    }
  }
  return total ? band / total : 0;
}

function drawSpectrogram(canvas, spectral) {
  const context = canvas.getContext("2d");
  const { width, height } = canvas;
  const image = context.createImageData(width, height);
  const frames = spectral.frames;
  const maxMagnitude = Math.max(
    ...frames.map((frame) => Math.max(...frame)),
    0.0001,
  );

  for (let x = 0; x < width; x += 1) {
    const frame = frames[Math.floor((x / width) * frames.length)];
    for (let y = 0; y < height; y += 1) {
      const bin = Math.floor(((height - 1 - y) / height) * frame.length);
      const value = Math.log1p(frame[bin] * 40) / Math.log1p(maxMagnitude * 40);
      const offset = (y * width + x) * 4;
      image.data[offset] = Math.round(15 + value * 220);
      image.data[offset + 1] = Math.round(32 + value * 135);
      image.data[offset + 2] = Math.round(38 + value * 70);
      image.data[offset + 3] = 255;
    }
  }

  context.putImageData(image, 0, 0);
}

function renderSpectralFeatures(spectral, elapsedMs) {
  els.analysisLatency.textContent = `解析 ${Math.round(elapsedMs)}ms`;
  els.vowelFeature.textContent = Math.round(spectral.vowel * 100);
  els.rFeature.textContent = Math.round(spectral.rBand * 100);
  els.thFeature.textContent = Math.round(spectral.thBand * 100);
}

function clearCanvas(canvas, text) {
  const context = canvas.getContext("2d");
  const { width, height } = canvas;
  drawGrid(context, width, height);
  context.fillStyle = "#66727c";
  context.font = "24px system-ui, sans-serif";
  context.textAlign = "center";
  context.fillText(text, width / 2, height / 2 + 8);
}

function clearRecording() {
  stopVad();
  if (state.recordedUrl) URL.revokeObjectURL(state.recordedUrl);
  state.recordedBlob = null;
  state.recordedUrl = null;
  state.recordingChunks = [];
  state.lastMetrics = null;
  els.playMineButton.disabled = true;
  els.playMineButton.classList.remove("recording");
}

function setStatus(text) {
  els.recordingStatus.textContent = text;
}

async function loadSelectedFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const text = decodeWordFileBuffer(await file.arrayBuffer());
  loadWordsFromText(text);
  event.target.value = "";
}

async function loadHostedWords() {
  const fileName = els.hostedWordSelect.value;
  try {
    setStatus(`${fileName} を読み込み中`);
    const response = await fetch(`words/${fileName}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = decodeWordFileBuffer(await response.arrayBuffer());
    loadWordsFromText(text);
  } catch (error) {
    setStatus(`words/${fileName} を読み込めませんでした`);
  }
}

async function autoLoadDefaultWords() {
  try {
    const response = await fetch("words/JH001.txt", { cache: "no-store" });
    if (!response.ok) return;
    const text = decodeWordFileBuffer(await response.arrayBuffer());
    loadWordsFromText(text);
  } catch (error) {
    setStatus("録音待機中");
  }
}

function decodeWordFileBuffer(buffer) {
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
  } catch (error) {
    return new TextDecoder("shift_jis").decode(buffer);
  }
}

function loadPastedWords() {
  loadWordsFromText(els.wordPaste.value);
}

function loadWordsFromText(text) {
  const parsed = parseWordText(text);
  if (!parsed.length) {
    setStatus("単語リストを読み込めませんでした");
    return;
  }
  state.words = parsed;
  state.index = -1;
  clearRecording();
  setStatus(`${parsed.length}語を読み込みました。右矢印で開始`);
  render();
}

function runRecognitionCheck() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    els.recognitionResult.textContent = "このブラウザは音声認識に対応していません";
    return;
  }

  const startedAt = performance.now();
  const recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  els.recognitionResult.textContent = "聞き取り中";

  recognition.onresult = (event) => {
    const elapsed = Math.round(performance.now() - startedAt);
    const text = event.results[0][0].transcript;
    els.recognitionResult.textContent = `${elapsed}ms: "${text}"`;
  };
  recognition.onerror = (event) => {
    els.recognitionResult.textContent = `認識エラー: ${event.error}`;
  };
  recognition.onend = () => {
    if (els.recognitionResult.textContent === "聞き取り中") {
      els.recognitionResult.textContent = "音声を検出できませんでした";
    }
  };
  recognition.start();
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function getRms(samples) {
  let sumSquares = 0;
  for (const sample of samples) sumSquares += sample * sample;
  return Math.sqrt(sumSquares / samples.length);
}

function encodeWav(audioBuffer) {
  const samples = audioBuffer.getChannelData(0);
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2;
  const blockAlign = bytesPerSample;
  const buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
  const view = new DataView(buffer);

  writeString(view, 0, "RIFF");
  view.setUint32(4, 36 + samples.length * bytesPerSample, true);
  writeString(view, 8, "WAVE");
  writeString(view, 12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, "data");
  view.setUint32(40, samples.length * bytesPerSample, true);

  let offset = 44;
  for (const sample of samples) {
    const clipped = clamp(sample, -1, 1);
    view.setInt16(offset, clipped < 0 ? clipped * 0x8000 : clipped * 0x7fff, true);
    offset += 2;
  }

  return new Blob([buffer], { type: "audio/wav" });
}

function writeString(view, offset, value) {
  for (let index = 0; index < value.length; index += 1) {
    view.setUint8(offset + index, value.charCodeAt(index));
  }
}
